[package]
name = "macro-journal-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ammonia = "4.1.4"
gloo-net = "0.7.0"
leptos = { version = "0.8.23", features = ["csr"] }
macro-journal-shared = { path = "../../crates/shared" }
pulldown-cmark = "0.13.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlDocument",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Storage",
] }
console_error_panic_hook = "0.1"
